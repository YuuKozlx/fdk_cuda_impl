schema_version = 2

[workflow]
mode = "project_and_reconstruct"

[projection]
label_volume = "../../inputs/generated/tungsten-wire-0p05.raw"
spectrum_file = "../../spectra/120kVp_12deg_1000mm_2mmAl.spec"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
output_file = "../../outputs/quality/tungsten-wire-0p2-projection.raw"
energy_output_file = "../../outputs/quality/tungsten-wire-0p2-energy.raw"
apply_geometry_flux = true

[projection.sampling]
samples_per_pixel = 50
spatial_seed = 12345

[projection.focal_spot]
enabled = true
size_u_mm = 1.2
size_v_mm = 0.9

[geometry]
kind = "flat_cbct"
views = 540
views_per_turn = 540
rotation_direction = 1
detector_u = 1536
detector_v = 128
pixel_u_mm = 0.1
pixel_v_mm = 0.1
sid_mm = 500.0
sdd_mm = 1000.0
offset_u_mm = 0.0
offset_n_mm = 0.0
offset_v_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
start_angle_rad = 0.0
pitch_mm_per_turn = 0.0
start_z_mm = 0.0
volume_x = 101
volume_y = 101
volume_z = 401
voxel_x_mm = 0.002
voxel_y_mm = 0.002
voxel_z_mm = 0.002
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
reconstruction_volume_x = 512
reconstruction_volume_y = 512
reconstruction_volume_z = 128
reconstruction_voxel_x_mm = 0.15
reconstruction_voxel_y_mm = 0.15
reconstruction_voxel_z_mm = 0.05
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[[projection.materials]]
label = 3
name = "tungsten"
formula = "W"
density_g_cm3 = 19.25

[reconstruction]
type = "analytic"
output_volume_file = "../../outputs/quality/tungsten-wire-0p2-fdk-512x512x128-f32.raw"
slice_prefix = "../../outputs/quality/tungsten-wire-0p2-fdk-512x512x128"

[reconstruction.analytic]
pipeline = "fdk"
filter = "ramlak"
chunk_views = 8

