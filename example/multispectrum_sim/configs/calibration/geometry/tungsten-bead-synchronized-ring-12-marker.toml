schema_version = 2

[workflow]
mode = "project_and_reconstruct"

[projection]
label_volume = "../../../inputs/generated/tungsten-bead-synchronized-ring-100mm-3mm-dual-marker5-12beads-0p2mm.raw"
spectrum_file = "../../../spectra/120kVp_12deg_1000mm_2mmAl.spec"
