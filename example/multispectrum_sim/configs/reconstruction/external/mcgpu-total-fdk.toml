# External-data TEMPLATE, not the geometry of a particular MCGPU scan.
# Prefer mcgpu_export_fdk's generated geometry, then copy the processing settings below.
# Import total.line_integrals.raw and total.air.raw into out/config-examples/imported/mcgpu/.
# Input is float32 [view][v][u], U fastest, already -log(I/I0). Never log it twice.
schema_version = 2

[workflow]
mode = "reconstruct"

[projection]
# This table supplies correction context only: no labels, materials or forward projection.
air_output_file = "../../../../../out/config-examples/imported/mcgpu/total.air.raw"
[projection.geometry_flux]
enabled = true
[projection.quantum_noise]
enabled = false
[projection.sampling]
samples_per_pixel = 1

[geometry]
# EXAMPLE acquisition. Replace with the exported scan geometry, including angle direction.
kind = "flat_cbct"
views = 360
views_per_turn = 360
rotation_direction = -1
start_angle_rad = 0.0
detector_u = 1024
detector_v = 256
pixel_u_mm = 0.6
pixel_v_mm = 0.6
sid_mm = 709.0
sdd_mm = 1143.0
offset_u_mm = 0.0
offset_v_mm = 0.0
offset_n_mm = 0.0
volume_x = 256
volume_y = 256
volume_z = 128
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0
reconstruction_volume_x = 256
reconstruction_volume_y = 256
reconstruction_volume_z = 128
reconstruction_voxel_x_mm = 1.0
reconstruction_voxel_y_mm = 1.0
reconstruction_voxel_z_mm = 1.0
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[reconstruction]
type = "analytic"
input_projection_file = "../../../../../out/config-examples/imported/mcgpu/total.line_integrals.raw"
output_volume_file = "../../../../../out/config-examples/mcgpu-total-fdk/reconstruction.raw"
slice_prefix = "../../../../../out/config-examples/mcgpu-total-fdk/slice"
save_slices = false

[reconstruction.analytic]
pipeline = "fdk"
filter = "hann"
cutoff = 0.5
gain = 1.0
chunk_views = 32

[reconstruction.preprocessing]
# Enable this AND the calibrated correction(s) below when calibration is available.
enabled = false

[reconstruction.preprocessing.scatter]
enabled = false
air_projection_file = "../../../../../out/config-examples/imported/mcgpu/total.air.raw"
model_file = "../../../../../out/calibration/scatter/mcgpu-runtime-model.json"
[reconstruction.preprocessing.scatter.correction]
iterations = 3
damping = 0.7
scatter_scale = 1.0
object_mask_threshold = 1e-6
[reconstruction.preprocessing.scatter.kernel]
mode = "all"
[reconstruction.preprocessing.scatter.solver]
type = "fixed"
[reconstruction.preprocessing.scatter.guide]
enabled = false
sigma_u_pixels = 2.0
sigma_v_pixels = 2.0

[reconstruction.preprocessing.beam_hardening]
enabled = false
# Supply measured polynomial coefficients, constant term first, before enabling.
# No spectrum or mAs estimate is required when using fitted coefficients.
fit_from_water_plate = false
# coefficients = [a0, a1, a2, a3]
order = 3
clamp_min = 0.0
clamp_max = 20.0
reference_energy_keV = 70.0

[reconstruction.bone_hardening]
# Optional model-based bone correction: needs a matched spectrum, material model and water BHC.
enabled = false
method = "physical_after_water"
max_iterations = 1
air_threshold_hu = -500.0
bone_threshold_hu = 300.0

[visualization]
enabled = false
