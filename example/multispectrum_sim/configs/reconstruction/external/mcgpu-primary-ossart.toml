# External-data TEMPLATE. Copy actual acquisition geometry from mcgpu_export_fdk.
# Primary excludes phantom scatter, but still contains polychromatic beam hardening.
# Do not apply scatter subtraction to this channel.
schema_version = 2
[workflow]
mode = "reconstruct"

[projection]
[projection.geometry_flux]
enabled = true
[projection.quantum_noise]
enabled = false
[projection.sampling]
samples_per_pixel = 1

[geometry]
kind = "flat_cbct"
views = 360
views_per_turn = 360
rotation_direction = -1
start_angle_rad = 0.0
detector_u = 1024
detector_v = 256
pixel_u_mm = 0.6
pixel_v_mm = 0.6
sid_mm = 709.0
sdd_mm = 1143.0
volume_x = 256
volume_y = 256
volume_z = 128
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0
reconstruction_volume_x = 256
reconstruction_volume_y = 256
reconstruction_volume_z = 128
reconstruction_voxel_x_mm = 1.0
reconstruction_voxel_y_mm = 1.0
reconstruction_voxel_z_mm = 1.0
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[reconstruction]
type = "iterative"
input_projection_file = "../../../../../out/config-examples/imported/mcgpu/primary.line_integrals.raw"
output_volume_file = "../../../../../out/config-examples/mcgpu-primary-ossart/reconstruction.raw"
slice_prefix = "../../../../../out/config-examples/mcgpu-primary-ossart/slice"
save_slices = false

[reconstruction.iterative]
algorithm = "ossart"
iterations = 10
subsets = 12
relaxation = 1.0
forward_projector = "joseph"
back_projector = "auto"
non_negative = true

[reconstruction.iterative.regularization]
# Starting point only; tune strength for your voxel spacing and attenuation scale.
plugin = "huber_tv_prox"
strength = 1e-4
huber_delta = 0.001
dimensions = 3

[reconstruction.preprocessing]
enabled = false
[reconstruction.preprocessing.beam_hardening]
enabled = false
fit_from_water_plate = false
# Supply your calibrated [a0, a1, ...] before enabling both switches.
order = 3
clamp_min = 0.0
clamp_max = 20.0
reference_energy_keV = 70.0

[visualization]
enabled = false
