# Current schema v2. Paths are relative to this TOML.
# Paired built-in example: water-circle
schema_version = 2

[geometry]
detector_u = 1024
detector_v = 256
kind = 'flat_cbct'
nikon_tilt_axis_azimuth_rad = 0.0
nikon_tilt_rad = 0.0
offset_n_mm = 0.0
offset_u_mm = 0.0
offset_v_mm = 0.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
phantom_rotation_x_rad = 0.0
phantom_rotation_y_rad = 0.0
phantom_rotation_z_rad = 0.0
pitch_mm_per_turn = 0.0
pixel_u_mm = 0.4
pixel_v_mm = 1.6
planar_detector_y_mm = 0.0
planar_resample_mode = 'perspective_orthogonal'
reconstruction_detector_u = 0
reconstruction_detector_v = 0
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0
reconstruction_volume_x = 64
reconstruction_volume_y = 64
reconstruction_volume_z = 32
reconstruction_voxel_x_mm = 4.0
reconstruction_voxel_y_mm = 4.0
reconstruction_voxel_z_mm = 4.0
rotation_axis_pivot_x_mm = 0.0
rotation_axis_pivot_y_mm = 0.0
rotation_axis_pivot_z_mm = 0.0
rotation_direction = 1
scan_range_rad = 6.283185307179586
sdd_mm = 1143.0
sid_mm = 709.0
source_lateral_offset_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
source_orbit_radius_mm = 0.0
start_angle_rad = 0.0
start_z_mm = 0.0
tilt_n_rad = 0.0
tilt_u_rad = 0.0
tilt_v_rad = 0.0
views = 360
views_per_turn = 360
volume_x = 128
volume_y = 128
volume_z = 64
voxel_x_mm = 2.0
voxel_y_mm = 2.0
voxel_z_mm = 2.0

[projection]
mAs_per_view = 1.0
save_metadata = true

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = false
    seed = 67890

    [projection.sampling]
    samples_per_pixel = 1
    spatial_seed = 12345

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 2.0
    export_file = '../../../../../out/config-examples/water-circle/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 1.0
    formula = 'H2O'
    label = 1
    name = 'water'

[reconstruction]
input_projection_file = '../../../../../out/config-examples/water-circle/projection.raw'
output_volume_file = '../../../../../out/config-examples/water-circle/reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/water-circle/slice'
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 32
    cutoff = 0.5
    filter = 'hann'
    gain = 1.0
    pipeline = 'fdk'

    [reconstruction.preprocessing]
    enabled = true

        [reconstruction.preprocessing.beam_hardening]
        clamp_max = 20.0
        clamp_min = 0.0
        coefficients = [ 0.0, 1.0 ]
        enabled = true
        fit_from_water_plate = true
        order = 1
        reference_energy_keV = 70.0
        water_plate_max_mm = 400.0
        water_plate_samples = 81

[visualization]
enabled = false

[workflow]
mode = 'reconstruct'