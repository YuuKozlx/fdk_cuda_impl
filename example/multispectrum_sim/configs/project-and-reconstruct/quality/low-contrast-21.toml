# Current schema v2. Paths are relative to this TOML.
# Custom phantom required: preserve this file's source dimensions, voxel spacing and label/material mapping.
schema_version = 2

[geometry]
detector_u = 1536
detector_v = 128
kind = 'flat_cbct'
nikon_tilt_axis_azimuth_rad = 0.0
nikon_tilt_rad = 0.0
offset_n_mm = 0.0
offset_u_mm = 0.0
offset_v_mm = 0.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
phantom_rotation_x_rad = 0.0
phantom_rotation_y_rad = 0.0
phantom_rotation_z_rad = 0.0
pitch_mm_per_turn = 0.0
pixel_u_mm = 0.1
pixel_v_mm = 0.2
planar_detector_y_mm = 500.0
planar_resample_mode = 'perspective_orthogonal'
reconstruction_detector_u = 1536
reconstruction_detector_v = 128
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0
reconstruction_volume_x = 512
reconstruction_volume_y = 512
reconstruction_volume_z = 128
reconstruction_voxel_x_mm = 0.15
reconstruction_voxel_y_mm = 0.15
reconstruction_voxel_z_mm = 0.1
rotation_axis_pivot_x_mm = 0.0
rotation_axis_pivot_y_mm = 0.0
rotation_axis_pivot_z_mm = 0.0
rotation_direction = 1
scan_range_rad = 6.283185307179586
sdd_mm = 1000.0
sid_mm = 500.0
source_lateral_offset_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
source_orbit_radius_mm = 0.0
start_angle_rad = 0.0
start_z_mm = 0.0
tilt_n_rad = 0.0
tilt_u_rad = 0.0
tilt_v_rad = 0.0
views = 540
views_per_turn = 540
volume_x = 704
volume_y = 704
volume_z = 51
voxel_x_mm = 0.1
voxel_y_mm = 0.1
voxel_z_mm = 0.1

[projection]
air_output_file = '../../../../../out/config-examples/low-contrast-21/air.raw'
energy_output_file = '../../../../../out/config-examples/low-contrast-21/energy.raw'
label_volume = '../../../../../out/prepared-examples/custom/low-contrast-21.raw'
mAs_per_view = 1.0
output_file = '../../../../../out/config-examples/low-contrast-21/projection.raw'
save_metadata = true

    [projection.batching]
    max_buffer_mib = 256
    views = 64

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = true
    seed = 67890

    [projection.sampling]
    samples_per_pixel = 50
    spatial_seed = 12345

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 1.0
    export_file = '../../../../../out/config-examples/low-contrast-21/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 1.0
    formula = 'H2O'
    label = 1
    name = 'water'

    [[projection.materials]]
    density_g_cm3 = 0.997
    formula = 'H2O'
    label = 2
    name = 'water_minus_0p3'

    [[projection.materials]]
    density_g_cm3 = 0.995
    formula = 'H2O'
    label = 3
    name = 'water_minus_0p5'

    [[projection.materials]]
    density_g_cm3 = 0.99
    formula = 'H2O'
    label = 4
    name = 'water_minus_1p0'

[reconstruction]
input_projection_file = '../../../../../out/config-examples/low-contrast-21/projection.raw'
output_volume_file = '../../../../../out/config-examples/low-contrast-21/low-contrast-21-reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/low-contrast-21/low-contrast-21'
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 8
    cutoff = 0.5
    filter = 'shepp-logan'
    gain = 1.0
    pipeline = 'fdk'

[visualization]
enabled = false

[workflow]
mode = 'project_and_reconstruct'