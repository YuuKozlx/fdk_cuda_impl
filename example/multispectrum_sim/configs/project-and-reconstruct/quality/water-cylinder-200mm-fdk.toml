# Current schema v2. Paths are relative to this TOML.
# Custom phantom required: preserve this file's source dimensions, voxel spacing and label/material mapping. Requires a calibrated scatter runtime model matching this acquisition; no model is bundled.
schema_version = 2

[geometry]
detector_u = 1024
detector_v = 256
kind = 'flat_cbct'
nikon_tilt_axis_azimuth_rad = 0.0
nikon_tilt_rad = 0.0
offset_n_mm = 0.0
offset_u_mm = 0.0
offset_v_mm = 0.0
phantom_offset_x_mm = 50.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
phantom_rotation_x_rad = 0.0
phantom_rotation_y_rad = 0.0
phantom_rotation_z_rad = 0.0
pitch_mm_per_turn = 0.0
pixel_u_mm = 0.795
pixel_v_mm = 0.53
planar_detector_y_mm = 434.0
planar_resample_mode = 'perspective_orthogonal'
reconstruction_detector_u = 1024
reconstruction_detector_v = 256
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0
reconstruction_volume_x = 1024
reconstruction_volume_y = 1024
reconstruction_volume_z = 30
reconstruction_voxel_x_mm = 0.33
reconstruction_voxel_y_mm = 0.33
reconstruction_voxel_z_mm = 1.0
rotation_axis_pivot_x_mm = 0.0
rotation_axis_pivot_y_mm = 0.0
rotation_axis_pivot_z_mm = 0.0
rotation_direction = 1
scan_range_rad = 6.283185307179586
sdd_mm = 1143.0
sid_mm = 709.0
source_lateral_offset_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
source_orbit_radius_mm = 0.0
start_angle_rad = 0.0
start_z_mm = 0.0
tilt_n_rad = 0.0
tilt_u_rad = 0.0
tilt_v_rad = 0.0
views = 360
views_per_turn = 360
volume_x = 401
volume_y = 401
volume_z = 256
voxel_x_mm = 0.5
voxel_y_mm = 0.5
voxel_z_mm = 0.5

[projection]
air_output_file = '../../../../../out/config-examples/water-cylinder-200mm-fdk/air.raw'
energy_output_file = '../../../../../out/config-examples/water-cylinder-200mm-fdk/energy.raw'
label_volume = '../../../../../out/prepared-examples/custom/water-cylinder-200mm-pmma5mm.raw'
mAs_per_view = 0.36
output_file = '../../../../../out/config-examples/water-cylinder-200mm-fdk/projection.raw'
save_metadata = true

    [projection.batching]
    max_buffer_mib = 256
    views = 64

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = false
    seed = 67890

    [projection.sampling]
    samples_per_pixel = 50
    spatial_seed = 12345

    [projection.scatter]
    enabled = true
    model_file = '../../../../../out/calibration/scatter/runtime-model.json'

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 1.0
    export_file = '../../../../../out/config-examples/water-cylinder-200mm-fdk/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 1.0
    formula = 'H2O'
    label = 1
    name = 'water'

    [[projection.materials]]
    density_g_cm3 = 1.18
    formula = 'C5H8O2'
    label = 2
    name = 'pmma'

[reconstruction]
input_projection_file = '../../../../../out/config-examples/water-cylinder-200mm-fdk/projection.raw'
output_volume_file = '../../../../../out/config-examples/water-cylinder-200mm-fdk/water-cylinder-200mm-fdk-reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/water-cylinder-200mm-fdk/water-cylinder-200mm-fdk'
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 8
    cutoff = 0.5
    filter = 'ramlak'
    gain = 1.0
    pipeline = 'fdk'

    [reconstruction.preprocessing]
    enabled = true

        [reconstruction.preprocessing.beam_hardening]
        clamp_max = 20.0
        clamp_min = 0.0
        coefficients = [ 0.0, 1.0 ]
        enabled = true
        fit_from_water_plate = true
        order = 3
        reference_energy_keV = 0.0
        water_plate_max_mm = 400.0
        water_plate_samples = 81

        [reconstruction.preprocessing.scatter]
        air_projection_file = '../../../../../out/config-examples/water-cylinder-200mm-fdk/air.raw'
        enabled = true
        model_file = '../../../../../out/calibration/scatter/runtime-model.json'

            [reconstruction.preprocessing.scatter.correction]
            damping = 0.7
            iterations = 3
            object_mask_threshold = 0.001
            scatter_scale = 1.0

            [reconstruction.preprocessing.scatter.guide]
            enabled = false
            sigma_u_pixels = 2.0
            sigma_v_pixels = 2.0

            [reconstruction.preprocessing.scatter.kernel]
            mode = 'all'

            [reconstruction.preprocessing.scatter.solver]
            type = 'fixed'

[visualization]
enabled = false

[workflow]
mode = 'project_and_reconstruct'