# Current schema v2. Paths are relative to this TOML.
# Custom phantom required: preserve this file's source dimensions, voxel spacing and label/material mapping. Requires a calibrated scatter runtime model matching this acquisition; no model is bundled.
schema_version = 2

[geometry]
detector_u = 1024
detector_v = 256
kind = 'flat_cbct'
nikon_tilt_axis_azimuth_rad = 0.0
nikon_tilt_rad = 0.0
offset_n_mm = 0.0
offset_u_mm = 0.0
offset_v_mm = 0.0
phantom_offset_x_mm = 10.0
phantom_offset_y_mm = 15.0
phantom_offset_z_mm = 20.0
phantom_rotation_x_rad = 0.0174532925199433
phantom_rotation_y_rad = 0.0349065850398866
phantom_rotation_z_rad = 0.0523598775598299
pitch_mm_per_turn = 0.0
pixel_u_mm = 0.795
pixel_v_mm = 0.53
planar_detector_y_mm = 434.0
planar_resample_mode = 'perspective_orthogonal'
reconstruction_detector_u = 1024
reconstruction_detector_v = 256
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0
reconstruction_volume_x = 1024
reconstruction_volume_y = 1024
reconstruction_volume_z = 30
reconstruction_voxel_x_mm = 0.33
reconstruction_voxel_y_mm = 0.33
reconstruction_voxel_z_mm = 1.0
rotation_axis_pivot_x_mm = 0.0
rotation_axis_pivot_y_mm = 0.0
rotation_axis_pivot_z_mm = 0.0
rotation_direction = 1
scan_range_rad = 6.283185307179586
sdd_mm = 1143.0
sid_mm = 709.0
source_lateral_offset_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
source_orbit_radius_mm = 0.0
start_angle_rad = 0.0
start_z_mm = 0.0
tilt_n_rad = 0.0
tilt_u_rad = 0.0
tilt_v_rad = 0.0
views = 360
views_per_turn = 360
volume_x = 401
volume_y = 401
volume_z = 256
voxel_x_mm = 0.5
voxel_y_mm = 0.5
voxel_z_mm = 0.5

[projection]
air_output_file = '../../../../../out/config-examples/water-cylinder-low-dose-scatter-v4/air.raw'
energy_output_file = '../../../../../out/config-examples/water-cylinder-low-dose-scatter-v4/energy.raw'
label_volume = '../../../../../out/prepared-examples/custom/water-cylinder-200mm-pmma5mm.raw'
mAs_per_view = 0.01
output_file = '../../../../../out/config-examples/water-cylinder-low-dose-scatter-v4/projection.raw'
save_metadata = true

    [projection.batching]
    max_buffer_mib = 256
    views = 64

    [projection.detector_postprocess.afterglow]
    enabled = true
    exposure_time_ms = 2.0
    frame_time_ms = 3.0
    initialization = 'zero'
    p = 0.05
    time_constants_ms = [ 1.0, 100.0 ]
    weights = [ 0.7, 0.3 ]

    [projection.detector_postprocess.das]
    adc_lsb_electrons = 0.0
    electronic_noise_std_electrons = 3.0
    enabled = true
    gain_electrons_per_keV = 15.0
    noise_seed = 20261009
    offset_electrons = 0.0
    saturation_electrons = 0.0

    [projection.detector_postprocess.electronic_crosstalk]
    enabled = true
    kernel_u = [ 0.005, 0.99, 0.005 ]
    kernel_v = [ 0.002, 0.996, 0.002 ]

    [projection.detector_postprocess.optical_crosstalk]
    enabled = true
    kernel_u = [ 0.03, 0.94, 0.03 ]
    kernel_v = [ 0.02, 0.96, 0.02 ]

    [projection.detector_response]
    enabled = true
    oblique_path_correction = true

        [projection.detector_response.impurity_layer]
        enabled = true
        name = 'detector_impurity'
        preset = 'compound.csi'
        thickness_mm = 0.01

        [projection.detector_response.protective_layer]
        name = 'carbon_fiber_cover'
        preset = 'compound.carbon_fiber_epoxy'
        thickness_mm = 0.5

        [projection.detector_response.scintillator_layer]
        name = 'cesium_iodide'
        preset = 'compound.csi'
        thickness_mm = 0.6

    [projection.focal_spot]
    defocus_enabled = true
    defocus_size_u_mm = 3.0
    defocus_size_v_mm = 2.0
    enabled = true
    epsilon = 0.01
    normal_size_u_mm = 1.2
    normal_size_v_mm = 0.9

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = true
    seed = 20261009

    [projection.sampling]
    samples_per_pixel = 5
    spatial_seed = 20261009

    [projection.scatter]
    enabled = true
    model_file = '../../../../../out/calibration/scatter/runtime-model.json'

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 1.0
    export_file = '../../../../../out/config-examples/water-cylinder-low-dose-scatter-v4/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 1.0
    formula = 'H2O'
    label = 1
    name = 'water'

    [[projection.materials]]
    density_g_cm3 = 1.18
    formula = 'C5H8O2'
    label = 2
    name = 'pmma'

[reconstruction]
input_projection_file = '../../../../../out/config-examples/water-cylinder-low-dose-scatter-v4/projection.raw'
output_volume_file = '../../../../../out/config-examples/water-cylinder-low-dose-scatter-v4/water-cylinder-low-dose-scatter-v4-reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/water-cylinder-low-dose-scatter-v4/water-cylinder-low-dose-scatter-v4'
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 8
    cutoff = 0.5
    filter = 'ramlak'
    gain = 1.0
    pipeline = 'fdk'

[visualization]
enabled = false

[workflow]
mode = 'project_and_reconstruct'