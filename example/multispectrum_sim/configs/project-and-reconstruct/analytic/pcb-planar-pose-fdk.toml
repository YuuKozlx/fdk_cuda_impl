# Current schema v2. Paths are relative to this TOML.
# Custom phantom required: preserve this file's source dimensions, voxel spacing and label/material mapping.
schema_version = 2

[geometry]
detector_u = 1024
detector_v = 1024
kind = 'planar_source_orbit'
nikon_tilt_axis_azimuth_rad = 0.0
nikon_tilt_rad = 0.0
offset_n_mm = 2.0
offset_u_mm = 5.0
offset_v_mm = 10.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
phantom_rotation_x_rad = -1.570796326794897
phantom_rotation_y_rad = 0.0
phantom_rotation_z_rad = 0.0
pitch_mm_per_turn = 0.0
pixel_u_mm = 0.417
pixel_v_mm = 0.417
planar_detector_y_mm = 100.0
planar_resample_mode = 'perspective_orthogonal'
reconstruction_detector_u = 512
reconstruction_detector_v = 512
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0
reconstruction_volume_x = 512
reconstruction_volume_y = 48
reconstruction_volume_z = 512
reconstruction_voxel_x_mm = 0.2
reconstruction_voxel_y_mm = 0.1
reconstruction_voxel_z_mm = 0.2
rotation_axis_pivot_x_mm = 0.0
rotation_axis_pivot_y_mm = 0.0
rotation_axis_pivot_z_mm = 0.0
rotation_direction = 1
scan_range_rad = 6.283185307179586
sdd_mm = 300.0
sid_mm = 200.0
source_lateral_offset_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
source_orbit_radius_mm = 15.0
start_angle_rad = 0.0
start_z_mm = 0.0
tilt_n_rad = 0.0174532925199433
tilt_u_rad = 0.01
tilt_v_rad = -0.015
views = 180
views_per_turn = 180
volume_x = 1000
volume_y = 1000
volume_z = 32
voxel_x_mm = 0.1
voxel_y_mm = 0.1
voxel_z_mm = 0.1

[projection]
air_output_file = '../../../../../out/config-examples/pcb-planar-pose-fdk/air.raw'
energy_output_file = '../../../../../out/config-examples/pcb-planar-pose-fdk/energy.raw'
label_volume = '../../../../../out/prepared-examples/custom/pcb-test-100mm-0p1mm.raw'
mAs_per_view = 0.5
output_file = '../../../../../out/config-examples/pcb-planar-pose-fdk/projection.raw'
save_metadata = true

    [projection.batching]
    max_buffer_mib = 256
    views = 64

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = false
    seed = 67890

    [projection.sampling]
    samples_per_pixel = 1
    spatial_seed = 12345

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 1.0
    export_file = '../../../../../out/config-examples/pcb-planar-pose-fdk/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 1.85
    formula = 'SiO2'
    label = 1
    name = 'fr4_glass_epoxy_equivalent'

    [[projection.materials]]
    density_g_cm3 = 8.96
    formula = 'Cu'
    label = 2
    name = 'copper_foil'

    [[projection.materials]]
    density_g_cm3 = 7.38
    formula = 'Sn103.3Ag3.53Cu'
    label = 3
    name = 'sac305_solder'

[reconstruction]
input_projection_file = '../../../../../out/config-examples/pcb-planar-pose-fdk/projection.raw'
output_volume_file = '../../../../../out/config-examples/pcb-planar-pose-fdk/pcb-planar-pose-fdk-reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/pcb-planar-pose-fdk/pcb-planar-pose-fdk'
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 32
    cutoff = 0.5
    filter = 'ramlak'
    gain = 1.0
    pipeline = 'fdk'

[visualization]
enabled = false

[workflow]
mode = 'project_and_reconstruct'