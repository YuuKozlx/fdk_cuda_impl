# Current schema v2. Paths are relative to this TOML.
# Prepare brainweb-normal with --center-slices 33.
schema_version = 2

[geometry]
detector_u = 1024
detector_v = 256
kind = 'flat_cbct'
nikon_tilt_axis_azimuth_rad = 0.0
nikon_tilt_rad = 0.0
offset_n_mm = 0.0
offset_u_mm = 0.0
offset_v_mm = 0.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
phantom_rotation_x_rad = 0.0
phantom_rotation_y_rad = 0.0
phantom_rotation_z_rad = 0.0
pitch_mm_per_turn = 0.0
pixel_u_mm = 0.47250000000000003
pixel_v_mm = 0.275625
planar_detector_y_mm = 434.69995100000006
planar_resample_mode = 'perspective_orthogonal'
reconstruction_detector_u = 1536
reconstruction_detector_v = 224
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0
reconstruction_volume_x = 181
reconstruction_volume_y = 217
reconstruction_volume_z = 33
reconstruction_voxel_x_mm = 1.0
reconstruction_voxel_y_mm = 1.0
reconstruction_voxel_z_mm = 1.0
rotation_axis_pivot_x_mm = 0.0
rotation_axis_pivot_y_mm = 0.0
rotation_axis_pivot_z_mm = 0.0
rotation_direction = 1
scan_range_rad = 6.283185307179586
sdd_mm = 1143.699951
sid_mm = 709.0
source_lateral_offset_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
source_orbit_radius_mm = 0.0
start_angle_rad = 0.0
start_z_mm = 0.0
tilt_n_rad = 0.0
tilt_u_rad = 0.0
tilt_v_rad = 0.0
views = 720
views_per_turn = 720
volume_x = 181
volume_y = 217
volume_z = 33
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0

[projection]
air_output_file = '../../../../../out/config-examples/brainweb-center33-fdk/air.raw'
energy_output_file = '../../../../../out/config-examples/brainweb-center33-fdk/energy.raw'
label_volume = '../../../../../out/prepared-examples/brainweb-center33/labels.mat'
mAs_per_view = 1.0
output_file = '../../../../../out/config-examples/brainweb-center33-fdk/projection.raw'
save_metadata = true

    [projection.batching]
    max_buffer_mib = 256
    views = 64

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = true
    seed = 67890

    [projection.sampling]
    samples_per_pixel = 50
    spatial_seed = 12345

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 1.0
    export_file = '../../../../../out/config-examples/brainweb-center33-fdk/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 0.001205
    label = 0
    name = 'background-air'
    preset = 'mixture.air'

    [[projection.materials]]
    density_g_cm3 = 1.007
    label = 1
    name = 'csf'
    preset = 'compound.water'

    [[projection.materials]]
    density_g_cm3 = 1.045
    label = 2
    name = 'grey-matter'
    preset = 'tissue.icru_brain_adult'

    [[projection.materials]]
    density_g_cm3 = 1.041
    label = 3
    name = 'white-matter'
    preset = 'tissue.icru_brain_adult'

    [[projection.materials]]
    density_g_cm3 = 0.95
    label = 4
    name = 'fat'
    preset = 'tissue.icru_adipose_adult2'

    [[projection.materials]]
    density_g_cm3 = 1.05
    label = 5
    name = 'muscle-skin'
    preset = 'tissue.icru_muscle_adult'

    [[projection.materials]]
    density_g_cm3 = 1.09
    label = 6
    name = 'skin'
    preset = 'tissue.icru_skin_adult'

    [[projection.materials]]
    density_g_cm3 = 1.61
    label = 7
    name = 'skull'
    preset = 'tissue.ncat_skull'

    [[projection.materials]]
    density_g_cm3 = 1.04
    label = 8
    name = 'glial-matter'
    preset = 'tissue.icru_brain_adult'

    [[projection.materials]]
    density_g_cm3 = 1.12
    label = 9
    name = 'connective'
    preset = 'tissue.icru_muscle_adult'

[reconstruction]
input_projection_file = '../../../../../out/config-examples/brainweb-center33-fdk/projection.raw'
output_volume_file = '../../../../../out/config-examples/brainweb-center33-fdk/brainweb-center33-fdk-reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/brainweb-center33-fdk/brainweb-center33-fdk'
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 8
    cutoff = 0.5
    filter = 'ramlak'
    gain = 1.0
    pipeline = 'fdk'

[visualization]
enabled = false

[workflow]
mode = 'project_and_reconstruct'