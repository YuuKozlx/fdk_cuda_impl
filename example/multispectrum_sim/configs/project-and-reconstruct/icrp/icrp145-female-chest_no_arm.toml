[reconstruction]
input_projection_file = '../../../../../out/config-examples/icrp145-female-chest_no_arm/projection.raw'
output_volume_file = '../../../../../out/config-examples/icrp145-female-chest_no_arm/icrp145-female-chest_no_arm-reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/icrp145-female-chest_no_arm/icrp145-female-chest_no_arm'
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 32
    cutoff = 0.5
    filter = 'hann'
    gain = 1.0
    pipeline = 'wfbp'

    [reconstruction.preprocessing]
    enabled = true

        [reconstruction.preprocessing.beam_hardening]
        clamp_max = 20.0
        clamp_min = 0.0
        coefficients = [ 0.0, 1.0 ]
        enabled = true
        fit_from_water_plate = true
        order = 1
        reference_energy_keV = 70.0
        water_plate_max_mm = 600.0
        water_plate_samples = 81

[visualization]
enabled = false

[workflow]
mode = 'project_and_reconstruct'