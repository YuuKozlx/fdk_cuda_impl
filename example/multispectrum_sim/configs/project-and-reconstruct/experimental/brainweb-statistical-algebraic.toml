voxel_y_mm = 1.0
voxel_z_mm = 1.0

[projection]
air_output_file = '../../../../../out/config-examples/brainweb-statistical-algebraic/air.raw'
energy_output_file = '../../../../../out/config-examples/brainweb-statistical-algebraic/energy.raw'
label_volume = '../../../../../data/phantoms/brainweb/normal-1mm.mat'
mAs_per_view = 1.0
output_file = '../../../../../out/config-examples/brainweb-statistical-algebraic/projection.raw'
save_metadata = true

    [projection.batching]
    max_buffer_mib = 256
    views = 64

    [projection.focal_spot]
    defocus_enabled = true
    defocus_size_u_mm = 1.0
    defocus_size_v_mm = 1.0
    enabled = true
    epsilon = 0.01
    normal_size_u_mm = 0.4
    normal_size_v_mm = 0.4

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = true
    seed = 67890

    [projection.sampling]
    samples_per_pixel = 30
    spatial_seed = 12345

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 1.0
    export_file = '../../../../../out/config-examples/brainweb-statistical-algebraic/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 0.001205
    label = 0
    name = 'background-air'
    preset = 'mixture.air'

    [[projection.materials]]
    density_g_cm3 = 1.007
    label = 1
    name = 'csf'
    preset = 'compound.water'

    [[projection.materials]]
    density_g_cm3 = 1.045
    label = 2
    name = 'grey-matter'
    preset = 'tissue.icru_brain_adult'

    [[projection.materials]]
    density_g_cm3 = 1.041
    label = 3
    name = 'white-matter'
    preset = 'tissue.icru_brain_adult'

    [[projection.materials]]
    density_g_cm3 = 0.95
    label = 4
    name = 'fat'
    preset = 'tissue.icru_adipose_adult2'

    [[projection.materials]]
    density_g_cm3 = 1.05
    label = 5
    name = 'muscle-skin'
    preset = 'tissue.icru_muscle_adult'

    [[projection.materials]]
    density_g_cm3 = 1.09
    label = 6
    name = 'skin'
    preset = 'tissue.icru_skin_adult'

    [[projection.materials]]
    density_g_cm3 = 1.61
    label = 7
    name = 'skull'
    preset = 'tissue.ncat_skull'

    [[projection.materials]]
    density_g_cm3 = 1.04
    label = 8
    name = 'glial-matter'
    preset = 'tissue.icru_brain_adult'

    [[projection.materials]]
    density_g_cm3 = 1.12
    label = 9
    name = 'connective'
    preset = 'tissue.icru_muscle_adult'

[reconstruction]
input_projection_file = '../../../../../out/config-examples/brainweb-statistical-algebraic/projection.raw'
output_volume_file = '../../../../../out/config-examples/brainweb-statistical-algebraic/brainweb-statistical-algebraic-reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/brainweb-statistical-algebraic/brainweb-statistical-algebraic'
type = 'statistical'

    [reconstruction.preprocessing]
    enabled = true

        [reconstruction.preprocessing.beam_hardening]
        clamp_max = 20.0
        clamp_min = 0.0
        coefficients = [ 0.0, 1.0 ]
        enabled = true
        fit_from_water_plate = true
        order = 3
        reference_energy_keV = 70.0
        water_plate_max_mm = 300.0
        water_plate_samples = 81

    [reconstruction.statistical]
    back_projector = 'auto'
    forward_projector = 'auto'
    non_negative = true

        [reconstruction.statistical.data_fidelity]
        normalize_by_ray_count = false
        require_verified_adjoint = false
        scale = 1.0
        type = 'weighted_least_squares'
        weights_file = ''

        [reconstruction.statistical.optimizer]
        backtracking = true
        iterations = 10
        max_backtracking = 20
        minimum_iterations = 1
        relative_tolerance = 0.0
        step_shrink = 0.5
        step_size = 0.0
        type = 'regularized_algebraic'

        [reconstruction.statistical.regularization]
        dimensions = 3
        plugin = 'huber_tv'
        shape = 5e-05
        strength = 1.0

[visualization]
enabled = false

[workflow]
mode = 'project_and_reconstruct'
