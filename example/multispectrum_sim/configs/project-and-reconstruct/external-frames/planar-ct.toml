# Run prepare-phantoms.ps1 once before opening this file.
# CSV is authoritative; see README.zh-CN.md for trajectory conventions.
schema_version=2
[workflow]
mode="project_and_reconstruct"
[geometry]
kind="planar_source_orbit"
frames_file="planar-ct.csv"
views=180
views_per_turn=180
detector_u=128
detector_v=128
pixel_u_mm=6.0
pixel_v_mm=6.0
volume_x=64
volume_y=64
volume_z=64
voxel_x_mm=4.0
voxel_y_mm=4.0
voxel_z_mm=4.0
reconstruction_volume_x=64
reconstruction_volume_y=64
reconstruction_volume_z=64
reconstruction_voxel_x_mm=4.0
reconstruction_voxel_y_mm=4.0
reconstruction_voxel_z_mm=4.0
sid_mm=500.0
sdd_mm=800.0
scan_range_deg=360.0
source_orbit_radius_mm=200.0
planar_detector_y_mm=300.0
reconstruction_detector_u=128
reconstruction_detector_v=128
[projection]
label_volume="../../../out/external-frames/phantoms/water-slab.raw"
output_file="../../../out/external-frames/planar-ct/projection.raw"
air_output_file="../../../out/external-frames/planar-ct/air.raw"
[projection.spectrum]
source="generated"
kvp=100.0
filters=[{material="Al",thickness_mm=2.0}]
[[projection.materials]]
label=1
name="water"
formula="H2O"
density_g_cm3=1.0
[projection.geometry_flux]
enabled=true
[projection.sampling]
samples_per_pixel=1
[projection.quantum_noise]
enabled=false
[reconstruction]
type="iterative"
input_projection_file="../../../out/external-frames/planar-ct/projection.raw"
output_volume_file="../../../out/external-frames/planar-ct/volume.raw"
save_slices=false
[reconstruction.iterative]
algorithm="ossart"
iterations=3
subsets=12
relaxation=1.0
[reconstruction.iterative.regularization]
plugin="none"
strength=0.0
[reconstruction.preprocessing]
enabled=true
[reconstruction.preprocessing.beam_hardening]
enabled=true
fit_from_water_plate=true
order=5
water_plate_samples=81
reference_energy_keV=70.0
[visualization]
enabled=false
auto_load_reconstruction=true
