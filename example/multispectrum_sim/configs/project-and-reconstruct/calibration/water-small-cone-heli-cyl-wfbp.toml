# Current schema v2. Paths are relative to this TOML.
# Prepare water-circle with --set nx 181 --set ny 217 --set nz 33 --set voxel 1 --set support_diameter 160 --set support_height 30. Exact 181x217x33 grid.
schema_version = 2

[geometry]
detector_u = 768
detector_v = 112
kind = 'cyl_helical'
nikon_tilt_axis_azimuth_rad = 0.0
nikon_tilt_rad = 0.0
offset_n_mm = 0.0
offset_u_mm = 0.0
offset_v_mm = 0.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
phantom_rotation_x_rad = 0.0
phantom_rotation_y_rad = 0.0
phantom_rotation_z_rad = 0.0
pitch_mm_per_turn = 8.0
pixel_u_mm = 0.630124
pixel_v_mm = 0.630124
planar_detector_y_mm = 434.69995100000006
planar_resample_mode = 'perspective_orthogonal'
reconstruction_detector_u = 768
reconstruction_detector_v = 112
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0
reconstruction_volume_x = 181
reconstruction_volume_y = 217
reconstruction_volume_z = 33
reconstruction_voxel_x_mm = 1.0
reconstruction_voxel_y_mm = 1.0
reconstruction_voxel_z_mm = 1.0
rotation_axis_pivot_x_mm = 0.0
rotation_axis_pivot_y_mm = 0.0
rotation_axis_pivot_z_mm = 0.0
rotation_direction = 1
scan_range_rad = 6.283185307179586
sdd_mm = 1143.699951
sid_mm = 709.0
source_lateral_offset_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
source_orbit_radius_mm = 0.0
start_angle_rad = 0.0
start_z_mm = -20.0
tilt_n_rad = 0.0
tilt_u_rad = 0.0
tilt_v_rad = 0.0
views = 1800
views_per_turn = 360
volume_x = 181
volume_y = 217
volume_z = 33
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0

[projection]
air_output_file = '../../../../../out/config-examples/water-small-cone-heli-cyl-wfbp/air.raw'
energy_output_file = '../../../../../out/config-examples/water-small-cone-heli-cyl-wfbp/energy.raw'
label_volume = '../../../../../out/prepared-examples/water-small-cone/labels.mat'
mAs_per_view = 1.0
output_file = '../../../../../out/config-examples/water-small-cone-heli-cyl-wfbp/projection.raw'
save_metadata = true

    [projection.batching]
    max_buffer_mib = 256
    views = 64

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = true
    seed = 67890

    [projection.sampling]
    samples_per_pixel = 50
    spatial_seed = 12345

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 1.0
    export_file = '../../../../../out/config-examples/water-small-cone-heli-cyl-wfbp/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 1.0
    label = 1
    name = 'water'
    preset = 'compound.water'

[reconstruction]
input_projection_file = '../../../../../out/config-examples/water-small-cone-heli-cyl-wfbp/projection.raw'
output_volume_file = '../../../../../out/config-examples/water-small-cone-heli-cyl-wfbp/water-small-cone-heli-cyl-wfbp-reconstruction.raw'
save_slices = false
slice_prefix = '../../../../../out/config-examples/water-small-cone-heli-cyl-wfbp/water-small-cone-heli-cyl-wfbp'
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 1800
    cutoff = 0.5
    filter = 'ramlak'
    gain = 1.0
    pipeline = 'wfbp'

[visualization]
enabled = false

[workflow]
mode = 'project_and_reconstruct'