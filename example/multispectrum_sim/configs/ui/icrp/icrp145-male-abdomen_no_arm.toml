[reconstruction]
input_projection_file = '../../../../../out/icrp145/icrp145-male-abdomen_no_arm/projection.raw'
output_volume_file = '../../../../../out/icrp145/icrp145-male-abdomen_no_arm/reconstruction.raw'
save_slices = false
slice_prefix = ''
type = 'analytic'

    [reconstruction.analytic]
    chunk_views = 32
    cutoff = 0.5
    filter = 'hann'
    gain = 1.0
    pipeline = 'wfbp'

    [reconstruction.geometry]
    enabled = false
    offset_n_mm = 0.0
    offset_u_mm = 0.0
    offset_v_mm = 0.0
    sdd_mm = 1000.0
    sid_mm = 500.0
    source_offset_x_mm = 0.0
    source_offset_y_mm = 0.0
    source_offset_z_mm = 0.0
    tilt_n_rad = 0.0
    tilt_u_rad = 0.0
    tilt_v_rad = 0.0

    [reconstruction.preprocessing]
    enabled = true

        [reconstruction.preprocessing.beam_hardening]
        clamp_max = 20.0
        clamp_min = 0.0
        coefficients = [ 0.0, 1.0 ]
        enabled = true
        fit_from_water_plate = true
        order = 1
        reference_energy_keV = 70.0
        water_plate_max_mm = 600.0
        water_plate_samples = 81

        [reconstruction.preprocessing.scatter]
        air_projection_file = ''
        enabled = false
        model_file = ''

            [reconstruction.preprocessing.scatter.correction]
            damping = 0.7
            iterations = 3
            object_mask_threshold = 1e-06
            scatter_scale = 1.0

            [reconstruction.preprocessing.scatter.guide]
            enabled = false
            sigma_u_pixels = 2.0
            sigma_v_pixels = 2.0

            [reconstruction.preprocessing.scatter.kernel]
            mode = 'all'

            [reconstruction.preprocessing.scatter.solver]
            type = 'fixed'

[visualization]
auto_load_reconstruction = false
enabled = false
hold_open = false
interactive = false
max_fps = 15.0
offscreen = false
projection = 'signal'
snapshot_directory = ''
texture_max_size = 512
volume_opacity_scale = 0.03

[workflow]
mode = 'project_and_reconstruct'