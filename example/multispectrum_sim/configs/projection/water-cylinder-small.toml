schema_version = 2

[workflow]
mode = "project"

[projection]
label_volume = "../../inputs/water-cylinder-128x128x64-u8.raw"
spectrum_file = "../../spectra/spectrum-120kv-150.csv"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
output_file = "../../outputs/projections/water-cylinder-small.raw"
energy_output_file = "../../outputs/projections/water-cylinder-small-energy.raw"
engine = "pixel_local_random"
apply_geometry_flux = true

[projection.pixel_local_random]
samples_per_pixel = 50
photons_per_pixel = 100000
photon_count_mode = "fixed"
spatial_seed = 12345
photon_seed = 67890

[projection.focal_spot]
enabled = false
size_u_mm = 0.0
size_v_mm = 0.0

[geometry]
kind = "flat_cbct"
views = 360
views_per_turn = 360
rotation_direction = 1
detector_u = 256
detector_v = 128
pixel_u_mm = 1.0
pixel_v_mm = 1.0
sid_mm = 500.0
sdd_mm = 1000.0
offset_u_mm = 0.0
offset_n_mm = 0.0
offset_v_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
start_angle_rad = 0.0
pitch_mm_per_turn = 0.0
start_z_mm = 0.0
volume_x = 128
volume_y = 128
volume_z = 64
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
reconstruction_volume_x = 128
reconstruction_volume_y = 128
reconstruction_volume_z = 64
reconstruction_voxel_x_mm = 1.0
reconstruction_voxel_y_mm = 1.0
reconstruction_voxel_z_mm = 1.0
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[[projection.materials]]
label = 1
name = "water"
formula = "H2O"
density_g_cm3 = 1.0

[projection.detector_effects]
efficiency_enabled = false
efficiency = 1.0
scatter_enabled = false
optical_crosstalk_enabled = false
afterglow_enabled = false
electronic_noise_enabled = false
electronic_noise_sigma = 0.0
