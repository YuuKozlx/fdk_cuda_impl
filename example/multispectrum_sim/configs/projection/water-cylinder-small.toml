schema_version = 2

[workflow]
mode = "project"

[projection]
label_volume = "../../inputs/water-cylinder-128x128x64-u8.raw"
spectrum_file = "../../spectra/120kVp_12deg_1000mm_2mmAl.spec"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
output_file = "../../outputs/projections/water-cylinder-small.raw"
energy_output_file = "../../outputs/projections/water-cylinder-small-energy.raw"
air_output_file = "../../outputs/projections/water-cylinder-small-air.raw"
apply_geometry_flux = true

[projection.sampling]
samples_per_pixel = 50
spatial_seed = 12345

[projection.focal_spot]
enabled = false
size_u_mm = 0.0
size_v_mm = 0.0

[geometry]
kind = "flat_cbct"
views = 360
views_per_turn = 360
rotation_direction = 1
detector_u = 256
detector_v = 128
pixel_u_mm = 1.0
pixel_v_mm = 1.0
sid_mm = 500.0
sdd_mm = 1000.0
offset_u_mm = 0.0
offset_n_mm = 0.0
offset_v_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
start_angle_rad = 0.0
pitch_mm_per_turn = 0.0
start_z_mm = 0.0
volume_x = 128
volume_y = 128
volume_z = 64
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
reconstruction_volume_x = 128
reconstruction_volume_y = 128
reconstruction_volume_z = 64
reconstruction_voxel_x_mm = 1.0
reconstruction_voxel_y_mm = 1.0
reconstruction_voxel_z_mm = 1.0
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[[projection.materials]]
label = 1
name = "water"
formula = "H2O"
density_g_cm3 = 1.0

[projection.detector_response]
enabled = true
oblique_path_correction = true

[projection.detector_response.protective_layer]
name = "carbon_fiber_cover"
preset = "compound.carbon_fiber_epoxy"
thickness_mm = 0.5

[projection.detector_response.impurity_layer]
enabled = false

[projection.detector_response.scintillator_layer]
name = "cesium_iodide"
preset = "compound.csi"
thickness_mm = 0.6

[projection.detector_postprocess.optical_crosstalk]
enabled = false
kernel_u = [0.03, 0.94, 0.03]
kernel_v = [0.02, 0.96, 0.02]

[projection.detector_postprocess.afterglow]
enabled = false
p = 0.05
frame_time_ms = 3.0
exposure_time_ms = 2.0
weights = [0.7, 0.3]
time_constants_ms = [1.0, 100.0]

[projection.detector_postprocess.electronic_crosstalk]
enabled = false
kernel_u = [0.005, 0.99, 0.005]
kernel_v = [0.002, 0.996, 0.002]

[projection.detector_postprocess.das]
enabled = false
gain_electrons_per_keV = 15.0
offset_electrons = 0.0
electronic_noise_std_electrons = 0.0
saturation_electrons = 0.0
adc_lsb_electrons = 0.0
noise_seed = 24680

