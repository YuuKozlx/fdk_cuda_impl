# Current schema v2. Paths are relative to this TOML.
# Prepare with multispectrum_pack_mat --example bead-spiral. Known pose offsets are simulated; this file does not run calibration fitting.
schema_version = 2

[geometry]
detector_u = 1024
detector_v = 256
kind = 'flat_cbct'
nikon_tilt_axis_azimuth_rad = 0.0
nikon_tilt_rad = 0.0
offset_n_mm = 0.0
offset_u_mm = 2.085
offset_v_mm = 4.17
phantom_offset_x_mm = 10.0
phantom_offset_y_mm = 15.0
phantom_offset_z_mm = 20.0
phantom_rotation_x_rad = 0.0174532925199433
phantom_rotation_y_rad = 0.0349065850398866
phantom_rotation_z_rad = 0.0523598775598299
pitch_mm_per_turn = 0.0
pixel_u_mm = 0.417
pixel_v_mm = 1.668
planar_detector_y_mm = 330.0
planar_resample_mode = 'perspective_orthogonal'
reconstruction_detector_u = 1024
reconstruction_detector_v = 1024
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0
reconstruction_volume_x = 280
reconstruction_volume_y = 280
reconstruction_volume_z = 380
reconstruction_voxel_x_mm = 0.4
reconstruction_voxel_y_mm = 0.4
reconstruction_voxel_z_mm = 0.4
rotation_axis_pivot_x_mm = 0.0
rotation_axis_pivot_y_mm = 0.0
rotation_axis_pivot_z_mm = 0.0
rotation_direction = 1
scan_range_rad = 6.283185307179586
sdd_mm = 770.0
sid_mm = 440.0
source_lateral_offset_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 10.0
source_offset_z_mm = 5.0
source_orbit_radius_mm = 0.0
start_angle_rad = 0.0
start_z_mm = 0.0
tilt_n_rad = 0.0523598775598299
tilt_u_rad = 0.0174532925199433
tilt_v_rad = 0.0349065850398866
views = 360
views_per_turn = 360
volume_x = 560
volume_y = 560
volume_z = 760
voxel_x_mm = 0.2
voxel_y_mm = 0.2
voxel_z_mm = 0.2

[projection]
air_output_file = '../../../../../out/config-examples/tungsten-bead-spiral/air.raw'
energy_output_file = '../../../../../out/config-examples/tungsten-bead-spiral/energy.raw'
label_volume = '../../../../../out/prepared-examples/bead-spiral/labels.mat'
mAs_per_view = 1.0
output_file = '../../../../../out/config-examples/tungsten-bead-spiral/projection.raw'
save_metadata = false

    [projection.batching]
    max_buffer_mib = 256
    views = 64

    [projection.geometry_flux]
    enabled = true

    [projection.quantum_noise]
    enabled = true
    seed = 67890

    [projection.sampling]
    samples_per_pixel = 5
    spatial_seed = 12345

    [projection.spectrum]
    anode_angle_deg = 12.0
    bin_width_keV = 1.0
    export_file = '../../../../../out/config-examples/tungsten-bead-spiral/spectrum.spec'
    kvp = 120.0
    model = 'spekpy-v1'
    source = 'generated'

        [[projection.spectrum.filters]]
        material = 'Al'
        thickness_mm = 2.0

    [[projection.materials]]
    density_g_cm3 = 1.18
    formula = 'C5H8O2'
    label = 1
    name = 'pmma_support'

    [[projection.materials]]
    density_g_cm3 = 19.25
    formula = 'W'
    label = 100
    name = 'tungsten'

[visualization]
enabled = false

[workflow]
mode = 'project'