schema_version = 2

[workflow]
mode = "project_and_reconstruct"

# BrainWeb 中心 33 层小锥角圆扫，用作多能谱重建数值基准。
[projection]
label_volume = "../../inputs/brainweb/brainweb-normal-1mm-center33-181x217x33-u8.raw"
spectrum_file = "../../spectra/spectrum-120kv-150.csv"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
output_file = "../../outputs/projections/brainweb-center33-fdk.raw"
path_cache_file = "../../outputs/path-cache/brainweb-center33-fdk.ykpc"
use_library_fp = true
use_cuda_spectral = true


energy_output_file = "../../outputs/projections/brainweb-center33-fdk-energy.raw"
apply_geometry_flux = true

[geometry]
kind = "flat_cbct"
views = 720
views_per_turn = 720
rotation_direction = 1
detector_u = 1536
detector_v = 224
pixel_u_mm = 0.315
pixel_v_mm = 0.315
sid_mm = 709.0
sdd_mm = 1143.699951
start_angle_rad = 0.0
start_z_mm = 0.0
offset_u_mm = 0.0
offset_n_mm = 0.0
offset_v_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
volume_x = 181
volume_y = 217
volume_z = 33
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[[projection.materials]]
label=0
name="background-air"
preset="mixture.air"
density_g_cm3=0.001205
[[projection.materials]]
label=1
name="csf"
preset="compound.water"
density_g_cm3=1.007
[[projection.materials]]
label=2
name="grey-matter"
preset="tissue.icru_brain_adult"
density_g_cm3=1.045
[[projection.materials]]
label=3
name="white-matter"
preset="tissue.icru_brain_adult"
density_g_cm3=1.041
[[projection.materials]]
label=4
name="fat"
preset="tissue.icru_adipose_adult2"
density_g_cm3=0.95
[[projection.materials]]
label=5
name="muscle-skin"
preset="tissue.icru_muscle_adult"
density_g_cm3=1.05
[[projection.materials]]
label=6
name="skin"
preset="tissue.icru_skin_adult"
density_g_cm3=1.09
[[projection.materials]]
label=7
name="skull"
preset="tissue.ncat_skull"
density_g_cm3=1.61
[[projection.materials]]
label=8
name="glial-matter"
preset="tissue.icru_brain_adult"
density_g_cm3=1.04
[[projection.materials]]
label=9
name="connective"
preset="tissue.icru_muscle_adult"
density_g_cm3=1.12

[projection.detector_effects]
efficiency_enabled=false
scatter_enabled=false
optical_crosstalk_enabled=false
afterglow_enabled=false
electronic_noise_enabled=false

[reconstruction]
output_volume_file = "../../outputs/reconstructions/brainweb-center33-sart-tv.raw"
slice_prefix = "../../outputs/images/brainweb-center33-sart-tv"

type = "iterative"

[reconstruction.iterative]
algorithm = "tigre_sart_tv"
iterations = 20
relaxation = 0.8
subsets = 1
forward_projector = "joseph"
back_projector = "joseph_v3"
tv_iterations = 20
tv_alpha = 0.002
tv_alpha_reduction = 0.95
maximum_update_ratio = 0.95
non_negative = true
