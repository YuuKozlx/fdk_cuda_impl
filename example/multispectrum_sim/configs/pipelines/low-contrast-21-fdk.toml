schema_version = 2

[workflow]
mode = "project_and_reconstruct"

[projection]
label_volume = "../../inputs/generated/low-contrast-21.raw"
spectrum_file = "../../spectra/spectrum-120kv-150.csv"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
output_file = "../../outputs/quality/low-contrast-21-projection.raw"
energy_output_file = "../../outputs/quality/low-contrast-21-energy.raw"
engine = "pixel_local_random"
apply_geometry_flux = true

[projection.pixel_local_random]
samples_per_pixel = 50
photons_per_pixel = 100000
photon_count_mode = "fixed"
spatial_seed = 12345
photon_seed = 67890

[projection.focal_spot]
enabled = false
size_u_mm = 0.0
size_v_mm = 0.0

[geometry]
kind = "flat_cbct"
views = 540
views_per_turn = 540
rotation_direction = 1
detector_u = 1536
detector_v = 128
pixel_u_mm = 0.1
pixel_v_mm = 0.2
sid_mm = 500.0
sdd_mm = 1000.0
offset_u_mm = 0.0
offset_n_mm = 0.0
offset_v_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
start_angle_rad = 0.0
pitch_mm_per_turn = 0.0
start_z_mm = 0.0
volume_x = 704
volume_y = 704
volume_z = 51
voxel_x_mm = 0.1
voxel_y_mm = 0.1
voxel_z_mm = 0.1
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
reconstruction_volume_x = 512
reconstruction_volume_y = 512
reconstruction_volume_z = 128
reconstruction_voxel_x_mm = 0.15
reconstruction_voxel_y_mm = 0.15
reconstruction_voxel_z_mm = 0.1
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[[projection.materials]]
label = 1
name = "water"
formula = "H2O"
density_g_cm3 = 1.0

[[projection.materials]]
label = 2
name = "water_minus_0p3"
formula = "H2O"
density_g_cm3 = 0.997

[[projection.materials]]
label = 3
name = "water_minus_0p5"
formula = "H2O"
density_g_cm3 = 0.995

[[projection.materials]]
label = 4
name = "water_minus_1p0"
formula = "H2O"
density_g_cm3 = 0.99

[projection.detector_effects]
efficiency_enabled = false
efficiency = 1.0
scatter_enabled = false
optical_crosstalk_enabled = false
afterglow_enabled = false
electronic_noise_enabled = false
electronic_noise_sigma = 0.0

[reconstruction]
type = "analytic"
output_volume_file = "../../outputs/quality/low-contrast-21-fdk-512x512x128-f32.raw"
slice_prefix = "../../outputs/quality/low-contrast-21-fdk-512x512x128"

[reconstruction.analytic]
pipeline = "fdk"
filter = "shepp-logan"
chunk_views = 8
