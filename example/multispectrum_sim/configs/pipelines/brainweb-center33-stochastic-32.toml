schema_version = 2

[workflow]
mode = "project"

[projection]
label_volume = "../../inputs/brainweb/brainweb-normal-1mm-center33-181x217x33-u8.raw"
spectrum_file = "../../spectra/spectrum-120kv-150.csv"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
output_file = "../../outputs/projections/brainweb-center33-stochastic-16.raw"
energy_output_file = "../../outputs/projections/brainweb-center33-stochastic-16-energy.raw"
engine = "pixel_local_random"
apply_geometry_flux = true

[projection.pixel_local_random]
samples_per_pixel = 50
photons_per_pixel = 100000
photon_count_mode = "poisson"
spatial_seed = 12345
photon_seed = 67890

[projection.focal_spot]
enabled = true
size_u_mm = 1.2
size_v_mm = 0.9

[geometry]
kind = "flat_cbct"
views = 720
views_per_turn = 720
rotation_direction = 1
detector_u = 1536
detector_v = 224
pixel_u_mm = 0.315
pixel_v_mm = 0.315
sid_mm = 709.0
sdd_mm = 1143.699951
offset_u_mm = 0.0
offset_n_mm = 0.0
offset_v_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
start_angle_rad = 0.0
pitch_mm_per_turn = 0.0
start_z_mm = 0.0
volume_x = 181
volume_y = 217
volume_z = 33
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
reconstruction_volume_x = 181
reconstruction_volume_y = 217
reconstruction_volume_z = 33
reconstruction_voxel_x_mm = 1.0
reconstruction_voxel_y_mm = 1.0
reconstruction_voxel_z_mm = 1.0
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

