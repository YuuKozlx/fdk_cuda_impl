schema_version = 2

[workflow]
mode = "project"

[projection]
label_volume = "../../inputs/generated/tungsten-wire-0p05.raw"
spectrum_file = "../../spectra/spectrum-120kv-150.csv"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
output_file = "../../outputs/quality/tungsten-wire-0p05-one-view-1000-nofocal-projection.raw"
energy_output_file = "../../outputs/quality/tungsten-wire-0p05-one-view-1000-nofocal-energy.raw"
engine = "pixel_local_random"
apply_geometry_flux = true

[projection.pixel_local_random]
samples_per_pixel = 1000
photons_per_pixel = 100000
photon_count_mode = "poisson"
spatial_seed = 12345
photon_seed = 67890

[projection.focal_spot]
enabled = false
size_u_mm = 0.0
size_v_mm = 0.0

[geometry]
kind = "flat_cbct"
views = 1
views_per_turn = 1
rotation_direction = 1
detector_u = 1536
detector_v = 128
pixel_u_mm = 0.1
pixel_v_mm = 0.1
sid_mm = 500.0
sdd_mm = 1000.0
offset_u_mm = 0.0
offset_n_mm = 0.0
offset_v_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
start_angle_rad = 0.0
pitch_mm_per_turn = 0.0
start_z_mm = 0.0
volume_x = 101
volume_y = 101
volume_z = 401
voxel_x_mm = 0.0005
voxel_y_mm = 0.0005
voxel_z_mm = 0.0005
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
reconstruction_volume_x = 512
reconstruction_volume_y = 512
reconstruction_volume_z = 128
reconstruction_voxel_x_mm = 0.15
reconstruction_voxel_y_mm = 0.15
reconstruction_voxel_z_mm = 0.05
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[[projection.materials]]
label = 3
name = "tungsten"
formula = "W"
density_g_cm3 = 19.25

[projection.detector_effects]
efficiency_enabled = false
efficiency = 1.0
scatter_enabled = false
optical_crosstalk_enabled = false
afterglow_enabled = false
electronic_noise_enabled = false
electronic_noise_sigma = 0.0
