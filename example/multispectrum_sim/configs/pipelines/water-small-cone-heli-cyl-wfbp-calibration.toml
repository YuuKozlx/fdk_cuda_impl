schema_version = 2

[workflow]
mode = "project_and_reconstruct"

[projection]
label_volume = ""
spectrum_file = "../../spectra/spectrum-120kv-150.csv"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
output_file = "../../outputs/calibration/water-wfbp-projection.raw"
energy_output_file = "../../outputs/calibration/water-wfbp-projection-energy.raw"
path_cache_file = "../../outputs/calibration/water-wfbp-paths.ykpc"
engine = "deterministic"
use_library_fp = true
use_cuda_spectral = true
apply_geometry_flux = true

[projection.focal_spot]
enabled = false
size_u_mm = 0.0
size_v_mm = 0.0

[geometry]
kind = "cyl_helical"
views = 1800
views_per_turn = 360
rotation_direction = 1
detector_u = 768
detector_v = 112
pixel_u_mm = 0.630124
pixel_v_mm = 0.630124
sid_mm = 709.0
sdd_mm = 1143.699951
offset_u_mm = 0.0
offset_n_mm = 0.0
offset_v_mm = 0.0
source_offset_x_mm = 0.0
source_offset_y_mm = 0.0
source_offset_z_mm = 0.0
start_angle_rad = 0.0
pitch_mm_per_turn = 8.0
start_z_mm = -20.0
volume_x = 181
volume_y = 217
volume_z = 33
voxel_x_mm = 1.0
voxel_y_mm = 1.0
voxel_z_mm = 1.0
phantom_offset_x_mm = 0.0
phantom_offset_y_mm = 0.0
phantom_offset_z_mm = 0.0
reconstruction_volume_x = 181
reconstruction_volume_y = 217
reconstruction_volume_z = 33
reconstruction_voxel_x_mm = 1.0
reconstruction_voxel_y_mm = 1.0
reconstruction_voxel_z_mm = 1.0
reconstruction_offset_x_mm = 0.0
reconstruction_offset_y_mm = 0.0
reconstruction_offset_z_mm = 0.0

[[projection.materials]]
label = 1
name = "water"
preset = "compound.water"
density_g_cm3 = 1.0

[projection.detector_effects]
efficiency_enabled = false
efficiency = 1.0
scatter_enabled = false
optical_crosstalk_enabled = false
afterglow_enabled = false
electronic_noise_enabled = false
electronic_noise_sigma = 0.0

[reconstruction]
type = "analytic"
output_volume_file = "../../outputs/calibration/water-wfbp-volume.raw"
slice_prefix = "../../outputs/calibration/water-wfbp"

[reconstruction.analytic]
pipeline = "wfbp"
filter = "ramlak"
wfbp_cutoff = 1.0
wfbp_apodization = 1.0
chunk_views = 1800
