schema_version = 2

[workflow]
mode = "project"

[projection]
label_volume = "../../inputs/generated/tungsten-bead-double-ring-100mm-100mm-3mm-12beads.raw"
spectrum_file = "../../spectra/spectrum-120kv-150.csv"
xcom_data_directory = "../../../../thirdparty/nist_xcom/data"
