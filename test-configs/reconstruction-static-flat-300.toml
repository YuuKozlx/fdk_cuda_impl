# 300^3 Catphan-like 定量/图像测试。
# 该文件用于较真实的分辨率和迭代次数测试，不纳入快速 smoke 测试。
task = "reconstruction"

[[case]]
name = "catphan-300-fdk"
pipeline = "fdk"
chunk_views = 16
[case.scan]
nu = 1024
nv = 256
views = 360
sid_mm = 1000.0
sdd_mm = 1170.0
du_mm = 0.35
dv_mm = 0.35
[case.volume]
nx = 300
ny = 300
nz = 300
# 256x0.35 mm 探测器在 1.17 放大倍率下仅覆盖约 76.6 mm 物方高度。
voxel_mm = [1.0, 1.0, 0.25]
[case.input]
mode = "phantom"
phantom = "catphan"
[case.filter]
kernel = "ramlak"
source = "discrete-fft"
[case.output]
volume = "output/normal-size/catphan_300_fdk.raw"
preview = "output/normal-size/catphan_300_fdk.bmp"

[[case]]
name = "catphan-300-ossart"
pipeline = "ossart"
chunk_views = 16
[case.scan]
nu = 1024
nv = 256
views = 360
sid_mm = 1000.0
sdd_mm = 1170.0
du_mm = 0.35
dv_mm = 0.35
[case.volume]
nx = 300
ny = 300
nz = 300
voxel_mm = [1.0, 1.0, 0.25]
[case.input]
mode = "phantom"
phantom = "catphan"
[case.algorithm]
# 20 轮、8 子集是质量和耗时之间的常用工程折中；需要收敛曲线时可提高到 50。
iterations = 20
subsets = 8
relaxation = 0.2
forward = "joseph"
back = "joseph-v3"
[case.output]
volume = "output/normal-size/catphan_300_ossart.raw"
preview = "output/normal-size/catphan_300_ossart.bmp"

