# 与 wfbp-flat.toml 使用完全相同的 BrainWeb、平板探测器和两圈螺旋轨迹，
# 仅将重建算法换成普通全批量 PWLS，用于比较材料绝对值恢复能力。
task = "helical-reconstruction"

[[case]]
name = "brainweb-flat-helical-pwls"
reconstructor = "pwls"
device = 0

[case.scan]
nu = 1024
nv = 256
views = 720
du_mm = 0.35
dv_mm = 0.35
offset_u_mm = 0.0
offset_v_mm = 0.0
sid_mm = 710.0
sdd_mm = 1170.0
start_angle_deg = 0.0
scan_range_deg = 720.0

[case.volume]
nx = 181
ny = 217
nz = 41
voxel_mm = [1.0, 1.0, 1.0]

[case.geometry]
pitch_mm = 20.0
start_z_mm = -20.0
views_per_rotation = 360

# PWLS 使用平板 SConeProjGeomVec；本节只声明投影数据的探测器类型。
[case.wfbp]
input_detector = "flat-panel"

[case.pwls]
iterations = 50
subsets = 1
relaxation = 0.8
regularizer = "none"
regularization = 0.0
huber_delta = 3e-3
epsilon = 1e-6
lower_bound = 0.0
upper_bound = 0.12

[case.input]
mode = "volume-raw"
volume = "../example/phantom/brainweb_normal_1mm_181x217x181_uint8.raw"
scalar_type = "uint8"
scale = 0.01
source_dimensions = [181, 217, 181]
crop_origin = [0, 0, 70]

[case.validation]
minimum_correlation = 0.80
minimum_slice_correlation = 0.80
maximum_absolute_nrmse = 0.25
maximum_mae = 0.006
maximum_absolute_bias = 0.005
maximum_material_bias = 0.010
maximum_background_mean = 0.006

[case.output]
volume = "output/helical-pwls-flat/brainweb.raw"
preview = "output/helical-pwls-flat/brainweb-center-z.bmp"
