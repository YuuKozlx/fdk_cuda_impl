# 焦点中心等扇角弧面探测器 wFBP。该输入已经处于 FreeCT 原生扇角网格，
# 不经过平板或一般圆柱探测器适配，直接进入 fan-to-parallel 重排。
task = "wfbp-reconstruction"

[[case]]
name = "brainweb-equiangular-wfbp"
device = 0

[case.scan]
nu = 1024
nv = 256
views = 720
# 等扇角自测中 du_mm 是弧面物理像素宽度，并与下方角步长保持一致。
du_mm = 0.35
dv_mm = 0.35
offset_u_mm = 0.0
offset_v_mm = 0.0
sid_mm = 710.0
sdd_mm = 1170.0
start_angle_deg = 0.0
scan_range_deg = 720.0

[case.volume]
nx = 181
ny = 217
nz = 41
voxel_mm = [1.0, 1.0, 1.0]

[case.geometry]
pitch_mm = 20.0
start_z_mm = -20.0
views_per_rotation = 360

[case.wfbp]
input_detector = "equiangular-arc"
focal_spot_mode = "none"
arc_channel_angle_step_rad = 0.00029914529914529915 # 0.35 / 1170
arc_principal_channel = 511.5
redundancy_flat = 0.6
filter_cutoff = 1.0
filter_apodization = 1.0

[case.input]
mode = "volume-raw"
volume = "../example/phantom/brainweb_normal_1mm_181x217x181_uint8.raw"
scalar_type = "uint8"
scale = 0.01
source_dimensions = [181, 217, 181]
crop_origin = [0, 0, 70]

[case.validation]
minimum_correlation = 0.80
minimum_slice_correlation = 0.80
maximum_absolute_nrmse = 0.25
maximum_mae = 0.006
maximum_absolute_bias = 0.005
maximum_material_bias = 0.010
maximum_background_mean = 0.006

[case.output]
volume = "output/wfbp-equiangular/brainweb.raw"
preview = "output/wfbp-equiangular/brainweb-center-z.bmp"
