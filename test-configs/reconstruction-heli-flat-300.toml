task="helical-reconstruction"

[[case]]
name="catphan-300-heli-flat-wfbp"
reconstructor="wfbp"
[case.scan]
nu=1024
nv=256
views=720
du_mm=0.35
dv_mm=0.35
sid_mm=1000.0
sdd_mm=1170.0
scan_range_deg=720.0
[case.volume]
nx=300
ny=300
nz=300
voxel_mm=[1.0,1.0,0.25]
[case.geometry]
pitch_mm=40.0
start_z_mm=-40.0
views_per_rotation=360
[case.wfbp]
input_detector="flat-panel"
focal_spot_mode="none"
redundancy_flat=0.6
filter_cutoff=1.0
filter_apodization=1.0
[case.input]
mode="phantom"
phantom="catphan"
[case.validation]
minimum_correlation=-1.0
minimum_slice_correlation=-1.0
maximum_absolute_nrmse=1000.0
maximum_mae=1000.0
maximum_absolute_bias=1000.0
[case.output]
volume="output/normal-size/heli-flat_wfbp.raw"
preview="output/normal-size/heli-flat_wfbp.bmp"

[[case]]
name="catphan-300-heli-flat-pwls"
reconstructor="pwls"
[case.scan]
nu=1024
nv=256
views=720
du_mm=0.35
dv_mm=0.35
sid_mm=1000.0
sdd_mm=1170.0
scan_range_deg=720.0
[case.volume]
nx=300
ny=300
nz=300
voxel_mm=[1.0,1.0,0.25]
[case.geometry]
pitch_mm=40.0
start_z_mm=-40.0
views_per_rotation=360
[case.wfbp]
input_detector="flat-panel"
[case.pwls]
iterations=20
subsets=1
relaxation=0.5
regularizer="huber"
regularization=1e-3
huber_delta=3e-3
lower_bound=0.0
upper_bound=0.12
[case.input]
mode="phantom"
phantom="catphan"
[case.validation]
minimum_correlation=-1.0
minimum_slice_correlation=-1.0
maximum_absolute_nrmse=1000.0
maximum_mae=1000.0
maximum_absolute_bias=1000.0
[case.output]
volume="output/normal-size/heli-flat_pwls.raw"
preview="output/normal-size/heli-flat_pwls.bmp"

[[case]]
name="catphan-300-heli-flat-ossart"
reconstructor="ossart"
[case.scan]
nu=1024
nv=256
views=720
du_mm=0.35
dv_mm=0.35
sid_mm=1000.0
sdd_mm=1170.0
scan_range_deg=720.0
[case.volume]
nx=300
ny=300
nz=300
voxel_mm=[1.0,1.0,0.25]
[case.geometry]
