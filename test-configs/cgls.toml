[[case]]
name = "basic-cgls-robust"
pipeline = "cgls"

[case.scan]
nu = 32
nv = 24
views = 8
sid_mm = 80.0
sdd_mm = 160.0

[case.volume]
nx = 16
ny = 16
nz = 12
voxel_mm = [1.0, 1.0, 1.0]

[case.input]
mode = "phantom"
phantom = "basic"

[case.algorithm]
iterations = 3
strategy = "robust-restart"
restart_on_divergence = true
epsilon = 1e-8
use_min = true
minimum = 0.0
forward = "joseph"
back = "joseph-v2"

[case.algorithm.convergence]
relative_residual = 0.0
relative_update = 0.0
relative_improvement = 0.0
minimum_iterations = 1
check_interval = 1
patience = 1

[case.output]
volume = "output/cgls/basic-robust.raw"
