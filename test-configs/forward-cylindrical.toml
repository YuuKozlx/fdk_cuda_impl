# 实验性圆柱弧面探测器前投。它使用 CylFpBp 匹配算子，不是普通平面 Joseph。
task = "forward-projection"

[[case]]
name = "cylindrical-arc-catphan"
device = 0

[case.scan]
nu = 48
nv = 32
views = 64
du_mm = 1.0
dv_mm = 1.0
offset_u_mm = 0.25
offset_v_mm = -0.5
sid_mm = 80.0
sdd_mm = 160.0
start_angle_deg = 0.0
scan_range_deg = 720.0
direction = 1

[case.volume]
nx = 32
ny = 32
nz = 32
voxel_mm = [1.0, 1.0, 1.0]

[case.geometry]
model = "cylindrical"
pitch_mm = 8.0
start_z_mm = -8.0
views_per_rotation = 32
# 圆柱曲率半径与 SDD 相互独立；设为 SDD 时退化为 FreeCT 等角弧面。
curvature_radius_mm = 140.0
# 0 表示按 du_mm / curvature_radius_mm 自动推导通道角步长。
channel_angle_step_rad = 0.0

[case.projector]
model = "cylindrical-joseph"
# 沿射线的超采样倍数；提高可减小离散误差，但会近似线性增加耗时。
samples_per_voxel = 1.0

[case.input]
mode = "phantom"
phantom = "catphan"

[case.output]
projection = "output/forward-cylindrical/catphan.raw"
preview = "output/forward-cylindrical/catphan-view32.bmp"
preview_view = 32
