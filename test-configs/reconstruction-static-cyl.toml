preview="output/static-cyl/catphan_cgls.bmp"

# 组合用例同时覆盖 Cyl FDK 初值、非整除分包输入和收敛检查。
[[case]]
name="catphan-static-cyl-fdk-ossart-batched"
pipeline="fdk-ossart"
[case.scan]
nu=32
nv=24
views=32
sid_mm=80.0
sdd_mm=160.0
[case.volume]
nx=16
ny=16
nz=12
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=0.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
iterations=3
subsets=4
relaxation=0.1
forward_model="joseph"
backprojector_model="joseph-v3"
projection_batch_views=7
[case.algorithm.convergence]
relative_residual=10.0
minimum_iterations=1
check_interval=1
patience=1
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/static-cyl/catphan_fdk_ossart_batched.raw"
preview="output/static-cyl/catphan_fdk_ossart_batched.bmp"
