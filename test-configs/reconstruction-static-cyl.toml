task = "cylindrical-reconstruction"

# 所有 case 使用同一 Catphan、静态圆柱几何和探测器采样，仅改变重建算法。
[[case]]
name = "catphan-static-cyl-fdk"
pipeline = "fdk"
[case.scan]
nu=32
nv=24
views=32
sid_mm=80.0
sdd_mm=160.0
[case.volume]
nx=16
ny=16
nz=12
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=0.0
views_per_rotation=32
# 解析入口应支持物理曲率 R != SDD，并自动重排到虚拟等角柱面。
curvature_radius_mm=120.0
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/static-cyl/catphan_fdk.raw"
preview="output/static-cyl/catphan_fdk.bmp"

[[case]]
name = "catphan-static-cyl-sirt"
pipeline = "sirt"
[case.scan]
nu=32
nv=24
views=32
sid_mm=80.0
sdd_mm=160.0
[case.volume]
nx=16
ny=16
nz=12
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=0.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
iterations=2
relaxation=0.2
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/static-cyl/catphan_sirt.raw"
preview="output/static-cyl/catphan_sirt.bmp"

[[case]]
name = "catphan-static-cyl-sart"
pipeline = "sart"
[case.scan]
nu=32
nv=24
views=32
sid_mm=80.0
sdd_mm=160.0
[case.volume]
nx=16
ny=16
nz=12
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=0.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
iterations=1
relaxation=0.2
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/static-cyl/catphan_sart.raw"
preview="output/static-cyl/catphan_sart.bmp"

