sdd_mm=160.0
[case.volume]
nx=16
ny=16
nz=12
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=0.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
iterations=2
