task = "cylindrical-reconstruction"

# HeliCylCT 使用同一 Catphan 和两圈圆柱螺旋几何。圆柱 FDK 不适用于该轨迹。
[[case]]
name="catphan-heli-cyl-sirt"
pipeline="sirt"
[case.scan]
nu=32
nv=24
views=64
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=16
ny=16
nz=16
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
iterations=2
relaxation=0.2
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/heli-cyl/catphan_sirt.raw"
preview="output/heli-cyl/catphan_sirt.bmp"

[[case]]
name="catphan-heli-cyl-sart"
pipeline="sart"
[case.scan]
nu=32
nv=24
views=64
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=16
ny=16
nz=16
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
iterations=1
relaxation=0.2
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/heli-cyl/catphan_sart.raw"
preview="output/heli-cyl/catphan_sart.bmp"

[[case]]
name="catphan-heli-cyl-ossart"
pipeline="ossart"
[case.scan]
nu=32
nv=24
views=64
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=16
ny=16
nz=16
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
iterations=2
subsets=4
relaxation=0.2
replay_streaming=true
[case.algorithm.weighting]
# 按逐视图角度间隔积分；无效射线由三维体积覆盖判定置零。
view_quadrature=true
helical_ray_coverage=true
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/heli-cyl/catphan_ossart.raw"
preview="output/heli-cyl/catphan_ossart.bmp"

[[case]]
name="catphan-heli-cyl-cgls"
pipeline="cgls"
[case.scan]
nu=32
nv=24
views=64
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=16
ny=16
nz=16
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
iterations=2
use_v3_backprojector=false
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/heli-cyl/catphan_cgls.raw"
preview="output/heli-cyl/catphan_cgls.bmp"

[[case]]
name="catphan-heli-cyl-pwls"
pipeline="pwls"
[case.scan]
nu=32
nv=24
views=64
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=16
ny=16
nz=16
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.algorithm]
samples_per_voxel=1.0
[case.pwls]
iterations=2
relaxation=0.5
regularizer="quadratic"
regularization=1e-3
projection_weight_scale=1.0
data_model="joseph-matched"
lower_bound=0.0
upper_bound=0.12
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/heli-cyl/catphan_pwls.raw"
preview="output/heli-cyl/catphan_pwls.bmp"
