task = "forward-projection"

# 四个 case 使用同一 Catphan 和相同的基础采样，用于仿真四类 CT 几何。
[[case]]
name="catphan-static-flat"
[case.scan]
nu=48
nv=32
views=32
du_mm=1.0
dv_mm=1.0
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=360.0
[case.volume]
nx=32
ny=32
nz=24
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
model="circular"
[case.projector]
model="joseph"
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
projection="output/forward-projection/static-flat.raw"
preview="output/forward-projection/static-flat.bmp"
preview_view=0

[[case]]
name="catphan-static-cyl"
[case.scan]
nu=48
nv=32
views=32
du_mm=1.0
dv_mm=1.0
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=360.0
[case.volume]
nx=32
ny=32
nz=24
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
model="cylindrical"
pitch_mm=0.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.projector]
model="cylindrical-joseph"
samples_per_voxel=1.0
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
projection="output/forward-projection/static-cyl.raw"
preview="output/forward-projection/static-cyl.bmp"
preview_view=0

[[case]]
name="catphan-heli-flat"
[case.scan]
nu=48
nv=32
views=64
du_mm=1.0
dv_mm=1.0
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=32
ny=32
nz=24
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
model="helical"
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
[case.projector]
model="joseph"
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
projection="output/forward-projection/heli-flat.raw"
preview="output/forward-projection/heli-flat.bmp"
preview_view=32

[[case]]
name="catphan-heli-cyl"
[case.scan]
nu=48
nv=32
views=64
du_mm=1.0
dv_mm=1.0
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=32
ny=32
nz=24
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
model="cylindrical"
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
curvature_radius_mm=160.0
[case.projector]
model="cylindrical-joseph"
samples_per_voxel=1.0
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
projection="output/forward-projection/heli-cyl.raw"
preview="output/forward-projection/heli-cyl.bmp"
preview_view=32
