# CylFpBp 匹配正反投测试。该任务输出原始圆柱投影和其匹配 BP 结果；
# BP 是 FP 的离散转置，不包含 FDK 或 wFBP 的解析重建权重。
task = "cyl-fp-bp"

[[case]]
name = "brainweb-cylindrical-fp-bp"
device = 0

[case.scan]
nu = 1024
nv = 256
views = 360
du_mm = 0.35
dv_mm = 0.35
offset_u_mm = 0.0
offset_v_mm = 0.0
sid_mm = 710.0
sdd_mm = 1170.0
start_angle_deg = 0.0
scan_range_deg = 360.0
direction = 1

[case.volume]
nx = 181
ny = 217
nz = 181
voxel_mm = [1.0, 1.0, 1.0]

[case.geometry]
model = "cylindrical"
pitch_mm = 0.0
start_z_mm = 0.0
views_per_rotation = 360
curvature_radius_mm = 900.0
channel_angle_step_rad = 0.0

[case.projector]
model = "cylindrical-joseph"
samples_per_voxel = 1.0

[case.operator]
mode = "forward-backproject"
# v3 支持当前 R=900 mm 的一般圆柱。fdk/fdk-matched 只接受 R=SDD，
# 选择它们前需把 curvature_radius_mm 改为 1170，或先重映射输入投影。
backprojector = "v3"

[case.input]
mode = "volume-raw"
volume = "../example/phantom/brainweb_normal_1mm_181x217x181_uint8.raw"
scalar_type = "uint8"
scale = 0.01

[case.output]
projection = "output/cyl-fp-bp/brainweb-projection.raw"
volume = "output/cyl-fp-bp/brainweb-backprojection.raw"
preview = "output/cyl-fp-bp/brainweb-projection-view180.bmp"
preview_view = 180

# 单独 BP 示例：读取前一个 case 生成的 float32 圆柱投影。通过 --case 只运行
# 本项时，应先保证 projection 文件已经存在或替换为自己的同尺寸投影。
[[case]]
name = "brainweb-cylindrical-bp"
device = 0

[case.scan]
nu = 1024
nv = 256
views = 360
du_mm = 0.35
dv_mm = 0.35
sid_mm = 710.0
sdd_mm = 1170.0
start_angle_deg = 0.0
scan_range_deg = 360.0
direction = 1

[case.volume]
nx = 181
ny = 217
nz = 181
voxel_mm = [1.0, 1.0, 1.0]

[case.geometry]
model = "cylindrical"
pitch_mm = 0.0
start_z_mm = 0.0
views_per_rotation = 360
curvature_radius_mm = 900.0
channel_angle_step_rad = 0.0

[case.projector]
model = "cylindrical-joseph"
samples_per_voxel = 1.0

[case.operator]
mode = "backproject"
backprojector = "v3"

[case.input]
mode = "projection-raw"
projection = "output/cyl-fp-bp/brainweb-projection.raw"

[case.output]
volume = "output/cyl-fp-bp/brainweb-backprojection-only.raw"
