[[case]]
name = "catphan-ossart-tv"
pipeline = "ossart"

[case.scan]
nu = 32
nv = 24
views = 8
sid_mm = 80.0
sdd_mm = 160.0

[case.volume]
nx = 16
ny = 16
nz = 12
voxel_mm = [1.0, 1.0, 1.0]

[case.input]
mode = "phantom"
phantom = "catphan"

[case.algorithm]
iterations = 2
subsets = 2
relaxation = 0.2
relaxation_reduction = 0.98
weight_model = "detailed"
subset_order = "golden-ratio"
forward = "joseph"
back = "joseph-v3"

[case.algorithm.regularization]
type = "smoothed-tv"
strength = 1e-3
inner_iterations = 2
dimensionality = "3d"
epsilon = 1e-4
strength_reduction = 0.95

[case.algorithm.convergence]
relative_residual = 0.0
relative_update = 0.0
relative_improvement = 0.0
minimum_iterations = 1
check_interval = 1
patience = 1

[case.output]
volume = "output/ossart/catphan-tv.raw"
