[[case]]
name="catphan-300-static-cyl-fdk-ossart"
pipeline="fdk-ossart"
[case.scan]
nu=1024
nv=256
views=360
du_mm=0.35
dv_mm=0.35
sid_mm=1000.0
sdd_mm=1170.0
[case.volume]
nx=300
ny=300
