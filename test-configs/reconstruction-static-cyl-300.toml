task="cylindrical-reconstruction"

# 300^3 静态圆柱探测器 Catphan-like 对比；所有 case 共享同一采集几何。
[[case]]
name="catphan-300-static-cyl-fdk"
pipeline="fdk"
[case.scan]
nu=1024
nv=256
views=360
du_mm=0.35
dv_mm=0.35
sid_mm=1000.0
sdd_mm=1170.0
[case.volume]
nx=300
ny=300
nz=300
voxel_mm=[1.0,1.0,0.25]
[case.geometry]
pitch_mm=0.0
views_per_rotation=360
curvature_radius_mm=1170.0
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/normal-size/static-cyl_fdk.raw"
preview="output/normal-size/static-cyl_fdk.bmp"

