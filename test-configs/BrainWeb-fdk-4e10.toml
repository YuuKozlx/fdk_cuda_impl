# BrainWeb 4e10 光子统计量数据：静态平板圆轨迹 FDK。
# 输入为 float32 强度投影，运行时使用共享空气场执行 -log(I/I0)。

[[case]]
name="total-brain-recon-4e10"
pipeline="fdk"
device=0
batch_views=32
chunk_views=32
[case.scan]
nu=1536
nv=128
views=360
du_mm=0.3150619
dv_mm=0.3150619
offset_u_mm=0.0
offset_v_mm=0.0
sid_mm=709.0
sdd_mm=1143.699951
start_angle_deg=0.0
scan_range_deg=360.0
short_scan=false
direction=1
[case.volume]
nx=600
ny=600
nz=40
voxel_mm=[0.5,0.5,0.5]
offset_mm=[0.0,0.0,0.0]
[case.input]
mode="projection-raw"
projection="../example/brainweb_normal_1mm_z360_1536x128_20260827_4e10/brainweb_normal_1mm_cbct_z360_1536x128_frame0_1536x128pixels_360proj.raw"
air="../example/brainweb_normal_1mm_z360_1536x128_20260827_4e10/brainweb_normal_1mm_cbct_z360_1536x128_air_frame0_1536x128pixels_1proj.raw"
minimum_ratio=1e-6
[case.filter]
kernel="ramlak"
source="discrete-fft"
cutoff=0.5
gain=1.0
[case.output]
volume="../example/brainweb_normal_1mm_z360_1536x128_20260827_4e10/brain_total_600_600_40_f32.raw"
preview="../example/brainweb_normal_1mm_z360_1536x128_20260827_4e10/brain_total_central_slice.bmp"

