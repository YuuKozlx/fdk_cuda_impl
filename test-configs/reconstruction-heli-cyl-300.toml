task="cylindrical-reconstruction"

# 两圈螺旋圆柱探测器；该几何没有圆柱 FDK 路径。
[[case]]
name="catphan-300-heli-cyl-sirt"
pipeline="sirt"
[case.scan]
nu=1024
nv=256
views=720
du_mm=0.35
dv_mm=0.35
sid_mm=1000.0
sdd_mm=1170.0
scan_range_deg=720.0
[case.volume]
nx=300
ny=300
nz=300
voxel_mm=[1.0,1.0,0.25]
[case.geometry]
pitch_mm=40.0
start_z_mm=-40.0
views_per_rotation=360
curvature_radius_mm=1170.0
[case.algorithm]
iterations=50
relaxation=0.2
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/normal-size/heli-cyl_sirt.raw"
preview="output/normal-size/heli-cyl_sirt.bmp"

[[case]]
name="catphan-300-heli-cyl-sart"
pipeline="sart"
[case.scan]
nu=1024
nv=256
views=720
du_mm=0.35
dv_mm=0.35
sid_mm=1000.0
sdd_mm=1170.0
scan_range_deg=720.0
[case.volume]
nx=300
ny=300
nz=300
voxel_mm=[1.0,1.0,0.25]
[case.geometry]
pitch_mm=40.0
start_z_mm=-40.0
views_per_rotation=360
curvature_radius_mm=1170.0
[case.algorithm]
iterations=10
relaxation=0.2
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/normal-size/heli-cyl_sart.raw"
preview="output/normal-size/heli-cyl_sart.bmp"

[[case]]
name="catphan-300-heli-cyl-ossart"
pipeline="ossart"
[case.scan]
nu=1024
nv=256
views=720
du_mm=0.35
dv_mm=0.35
sid_mm=1000.0
sdd_mm=1170.0
scan_range_deg=720.0
[case.volume]
nx=300
ny=300
nz=300
voxel_mm=[1.0,1.0,0.25]
[case.geometry]
pitch_mm=40.0
start_z_mm=-40.0
views_per_rotation=360
curvature_radius_mm=1170.0
[case.algorithm]
iterations=20
subsets=8
relaxation=0.2
replay_streaming=true
[case.algorithm.weighting]
view_quadrature=true
helical_ray_coverage=true
[case.input]
mode="phantom"
phantom="catphan"
[case.output]
volume="output/normal-size/heli-cyl_ossart.raw"
preview="output/normal-size/heli-cyl_ossart.bmp"

