# 真实投影示例。projection 的布局是 float32 [view][v][u]；文件字节数必须
# 严格等于 views * nv * nu * sizeof(float)，否则任务会在启动 CUDA 前失败。
[[case]]
name = "raw-fdk-example"
pipeline = "fdk"
chunk_views = 32

[case.scan]
nu = 1024
nv = 1024
views = 360
du_mm = 0.25
dv_mm = 0.25
offset_u_mm = 0.0
offset_v_mm = 0.0
sid_mm = 500.0
sdd_mm = 1000.0
start_angle_deg = 0.0
scan_range_deg = 360.0
short_scan = false
direction = 1

[case.volume]
nx = 512
ny = 512
nz = 400
voxel_mm = [0.1, 0.1, 0.1]
offset_mm = [0.0, 0.0, 0.0]

[case.input]
mode = "projection-raw"
projection = "data/projection.raw"

[case.filter]
kernel = "ramlak"
source = "discrete-fft"
cutoff = 0.5
gain = 1.0

[case.output]
volume = "output/reconstruction.raw"
