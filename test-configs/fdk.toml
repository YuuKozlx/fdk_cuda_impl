[[case]]
name = "catphan-fdk"
pipeline = "fdk"
device = 0
batch_views = 8
chunk_views = 8

[case.scan]
nu = 32
nv = 24
views = 16
sid_mm = 80.0
sdd_mm = 160.0

[case.volume]
nx = 16
ny = 16
nz = 12
voxel_mm = [1.0, 1.0, 1.0]

[case.input]
mode = "phantom"
phantom = "catphan"

[case.filter]
kernel = "ramlak"
source = "discrete-fft"
cutoff = 0.5
gain = 1.0

[case.output]
volume = "output/fdk/catphan.raw"
preview = "output/fdk/catphan.bmp"
