task = "helical-reconstruction"

# 三个 case 使用完全相同的 Catphan、平板探测器和两圈螺旋轨迹。
[[case]]
name = "catphan-heli-flat-wfbp"
reconstructor = "wfbp"
[case.scan]
nu=48
nv=32
views=64
du_mm=1.0
dv_mm=1.0
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=32
ny=32
nz=24
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
[case.wfbp]
input_detector="flat-panel"
focal_spot_mode="none"
redundancy_flat=0.6
filter_cutoff=1.0
filter_apodization=1.0
[case.input]
mode="phantom"
phantom="catphan"
[case.validation]
minimum_correlation=-1.0
minimum_slice_correlation=-1.0
maximum_absolute_nrmse=1000.0
maximum_mae=1000.0
maximum_absolute_bias=1000.0
[case.output]
volume="output/reconstruction-heli-flat/catphan_wfbp.raw"
preview="output/reconstruction-heli-flat/catphan_wfbp.bmp"

[[case]]
name = "catphan-heli-flat-pwls"
reconstructor = "pwls"
[case.scan]
nu=48
nv=32
views=64
du_mm=1.0
dv_mm=1.0
sid_mm=80.0
sdd_mm=160.0
scan_range_deg=720.0
[case.volume]
nx=32
ny=32
nz=24
voxel_mm=[1.0,1.0,1.0]
[case.geometry]
pitch_mm=8.0
start_z_mm=-8.0
views_per_rotation=32
[case.wfbp]
input_detector="flat-panel"
[case.pwls]
iterations=2
subsets=1
relaxation=0.5
regularizer="huber"
regularization=1e-3
huber_delta=3e-3
lower_bound=0.0
upper_bound=0.12
[case.input]
mode="phantom"
phantom="catphan"
[case.validation]
minimum_correlation=-1.0
minimum_slice_correlation=-1.0
maximum_absolute_nrmse=1000.0
maximum_mae=1000.0
maximum_absolute_bias=1000.0
[case.output]
volume="output/reconstruction-heli-flat/catphan_pwls.raw"
preview="output/reconstruction-heli-flat/catphan_pwls.bmp"

