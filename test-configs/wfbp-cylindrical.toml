# 一般圆柱弧面探测器螺旋 wFBP。CylFpBp 生成真实圆柱表面采样，wFBP
# 再将其插值为焦点中心等扇角数据，因此曲率半径不必等于 SDD。
task = "wfbp-reconstruction"

[[case]]
name = "brainweb-cylindrical-wfbp"
device = 0

[case.scan]
nu = 1024
nv = 256
views = 720
du_mm = 0.35
dv_mm = 0.35
offset_u_mm = 0.0
offset_v_mm = 0.0
sid_mm = 710.0
sdd_mm = 1170.0
start_angle_deg = 0.0
scan_range_deg = 720.0

[case.volume]
nx = 181
ny = 217
nz = 41
voxel_mm = [1.0, 1.0, 1.0]

[case.geometry]
pitch_mm = 20.0
start_z_mm = -20.0
views_per_rotation = 360

[case.wfbp]
input_detector = "cylindrical-arc"
focal_spot_mode = "none"
# 物理圆柱曲率半径，不是 SDD；等于 SDD 时才是焦点中心等角弧面。
arc_curvature_radius_mm = 900.0
redundancy_flat = 0.6
filter_cutoff = 1.0
filter_apodization = 1.0

[case.input]
mode = "volume-raw"
volume = "../example/phantom/brainweb_normal_1mm_181x217x181_uint8.raw"
scalar_type = "uint8"
scale = 0.01
source_dimensions = [181, 217, 181]
crop_origin = [0, 0, 70]

[case.validation]
minimum_correlation = 0.80
minimum_slice_correlation = 0.80
maximum_absolute_nrmse = 0.25
maximum_mae = 0.006
maximum_absolute_bias = 0.005
maximum_material_bias = 0.010
maximum_background_mean = 0.006

[case.output]
volume = "output/wfbp-cylindrical/brainweb.raw"
preview = "output/wfbp-cylindrical/brainweb-center-z.bmp"
