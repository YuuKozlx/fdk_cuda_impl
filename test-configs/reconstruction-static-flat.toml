# 同一 Catphan 模体、同一圆扫描几何下的重建器横向测试。
# 每个 case 只改变 pipeline 或对应算法参数，便于直接比较输出图像。

[[case]]
name = "catphan-fdk"
pipeline = "fdk"
chunk_views = 8
[case.scan]
nu = 32
nv = 24
views = 32
sid_mm = 80.0
sdd_mm = 160.0
du_mm = 1.0
dv_mm = 1.0
[case.volume]
nx = 16
ny = 16
nz = 12
voxel_mm = [1.0, 1.0, 1.0]
[case.input]
mode = "phantom"
phantom = "catphan"
[case.filter]
kernel = "ramlak"
source = "discrete-fft"
[case.output]
volume = "output/phantoms/catphan_fdk.raw"
preview = "output/phantoms/catphan_fdk.bmp"

