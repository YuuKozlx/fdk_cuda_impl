# 平板探测器螺旋 wFBP。volume-raw 先通过平板 Joseph FP 生成测试投影，
# 再由 wFBP 的平板适配层插值到等扇角网格；真实使用时改为 projection-raw。
task = "wfbp-reconstruction"

[[case]]
name = "brainweb-flat-wfbp"
device = 0

[case.scan]
nu = 1024
nv = 256
views = 720
du_mm = 0.35
dv_mm = 0.35
offset_u_mm = 0.0
offset_v_mm = 0.0
sid_mm = 710.0
sdd_mm = 1170.0
start_angle_deg = 0.0
scan_range_deg = 720.0

[case.volume]
nx = 181
ny = 217
nz = 41
voxel_mm = [1.0, 1.0, 1.0]

[case.geometry]
# pitch_mm 是源点每旋转一整圈的 Z 位移。
pitch_mm = 20.0
start_z_mm = -20.0
views_per_rotation = 360

[case.wfbp]
input_detector = "flat-panel"
focal_spot_mode = "none"
redundancy_flat = 0.6
angle_tolerance = 1e-3
filter_cutoff = 1.0
filter_apodization = 1.0

[case.input]
mode = "volume-raw"
volume = "../example/phantom/brainweb_normal_1mm_181x217x181_uint8.raw"
scalar_type = "uint8"
# BrainWeb 材料标签 2/4/6 映射为 0.02/0.04/0.06 mm^-1。
scale = 0.01
# 从完整 BrainWeb 中裁取有螺旋扫描覆盖的中心 41 层。
source_dimensions = [181, 217, 181]
crop_origin = [0, 0, 70]

[case.validation]
minimum_correlation = 0.80
minimum_slice_correlation = 0.80
# 以下五项直接约束原始重建值；不使用最佳拟合缩放后的结果判定。
maximum_absolute_nrmse = 0.25
maximum_mae = 0.006
maximum_absolute_bias = 0.005
maximum_material_bias = 0.010
maximum_background_mean = 0.006

[case.output]
volume = "output/wfbp-flat/brainweb.raw"
preview = "output/wfbp-flat/brainweb-center-z.bmp"
